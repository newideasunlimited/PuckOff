# SPDX-License-Identifier: Apache-2.0
CONFIG_GPIO=y
CONFIG_HWINFO=y

# USB: our own device with a serial console plus a gamepad.
CONFIG_USB_DEVICE_STACK_NEXT=y
CONFIG_CDC_ACM_SERIAL_INITIALIZE_AT_BOOT=n
CONFIG_USBD_CDC_ACM_CLASS=y
CONFIG_USBD_HID_SUPPORT=y
CONFIG_UART_LINE_CTRL=y

# Console and shell on the USB serial port.
CONFIG_SERIAL=y
CONFIG_CONSOLE=y
CONFIG_UART_CONSOLE=y
CONFIG_SHELL=y
CONFIG_SHELL_BACKEND_SERIAL=y
CONFIG_SHELL_PROMPT_UART="puckoff:~$ "
CONFIG_SHELL_BACKEND_SERIAL_CHECK_DTR=y
# A guarded import exceeds the default 64-byte serial receive ring.
CONFIG_SHELL_BACKEND_SERIAL_RX_RING_BUFFER_SIZE=256
CONFIG_SHELL_CMD_BUFF_SIZE=256
CONFIG_SHELL_METAKEYS=y
CONFIG_SHELL_ECHO_STATUS=y
CONFIG_SHELL_VT100_COMMANDS=y
CONFIG_SHELL_STACK_SIZE=3072
# Pairing import commands contain private records; do not retain command history.
CONFIG_SHELL_HISTORY=n

CONFIG_LOG=y
CONFIG_LOG_MODE_DEFERRED=y
CONFIG_USBD_LOG_LEVEL_WRN=y
CONFIG_USBD_HID_LOG_LEVEL_WRN=y
CONFIG_UDC_DRIVER_LOG_LEVEL_WRN=y

# Remember the pairing across power cycles.
CONFIG_FLASH=y
CONFIG_FLASH_MAP=y
CONFIG_NVS=y
CONFIG_SETTINGS=y
CONFIG_SETTINGS_NVS=y

CONFIG_MAIN_STACK_SIZE=2048
CONFIG_CLOCK_CONTROL=y
CONFIG_REBOOT=y
