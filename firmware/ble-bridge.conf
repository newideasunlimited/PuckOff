# Overlay on prj.conf: build with -DEXTRA_CONF_FILE=ble-bridge.conf
CONFIG_PUCKOFF_TRANSPORT_BLE_BRIDGE=y

CONFIG_BT=y
CONFIG_BT_PERIPHERAL=y
CONFIG_BT_LL_SOFTDEVICE=y
CONFIG_BT_SMP=y
CONFIG_BT_BONDABLE=y
CONFIG_BT_MAX_CONN=1
# A board can move between a few TVs, phones and computers without re-pairing.
CONFIG_BT_MAX_PAIRED=4
CONFIG_BT_SETTINGS=y
CONFIG_BT_DEVICE_NAME="PuckOff"
CONFIG_BT_DEVICE_APPEARANCE=964
CONFIG_BT_ATT_TX_COUNT=2
CONFIG_BT_GATT_AUTO_SEC_REQ=n
CONFIG_BT_AUTO_PHY_UPDATE=n
CONFIG_BT_PERIPHERAL_PREF_MIN_INT=6
CONFIG_BT_PERIPHERAL_PREF_MAX_INT=12
CONFIG_BT_PERIPHERAL_PREF_LATENCY=0
CONFIG_BT_PERIPHERAL_PREF_TIMEOUT=400
CONFIG_BT_DIS=y
CONFIG_BT_DIS_MANUF_NAME=y
CONFIG_BT_DIS_MANUF_NAME_STR="New Ideas Unlimited, LLC"
CONFIG_BT_DIS_MODEL_NUMBER=y
CONFIG_BT_DIS_MODEL_NUMBER_STR="PuckOff BLE bridge"
CONFIG_BT_DIS_PNP=n

# The controller link borrows the radio between Bluetooth events.
CONFIG_MPSL_TIMESLOT_SESSION_COUNT=1

# Many Pro Micro nRF52840 clones have no 32.768 kHz crystal. The default
# image only survives on them because Zephyr's two-stage LFXO start runs on
# the RC oscillator while it waits for a crystal that never comes; the
# SoftDevice Controller waits for that crystal too, and the board hangs.
# The calibrated RC oscillator works on every board.
CONFIG_CLOCK_CONTROL_NRF_K32SRC_RC=y
CONFIG_CLOCK_CONTROL_NRF_K32SRC_RC_CALIBRATION=y

# Hardware-untested build: recover from a hung boot without a paperclip.
CONFIG_PUCKOFF_BOOT_GUARD=y

CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=2048
CONFIG_BT_TX_PROCESSOR_STACK_SIZE=1024
