# EXTRA_CONF_FILE on ble-diagnostic.conf; selects the real RF backend, not manual input.
CONFIG_PUCKOFF_TRANSPORT_BLE_DIAGNOSTIC=n
CONFIG_PUCKOFF_TRANSPORT_BLE_RF=y
CONFIG_HWINFO=y
CONFIG_MPSL_TIMESLOT_SESSION_COUNT=1
CONFIG_BT_DEVICE_NAME="PuckOff BLE RF"
CONFIG_BT_DIS_MODEL_NUMBER_STR="Experimental MPSL RF bridge"
CONFIG_CDC_ACM_SERIAL_PRODUCT_STRING="PuckOff BLE RF experiment"
CONFIG_SHELL_PROMPT_UART="ble-rf:~$ "

# Leave scheduling space for normal-priority proprietary radio requests.
CONFIG_BT_CTLR_SDC_MAX_CONN_EVENT_LEN_DEFAULT_OVERRIDE=y
CONFIG_BT_CTLR_SDC_MAX_CONN_EVENT_LEN_DEFAULT=1500
CONFIG_BT_CTLR_SDC_CONN_EVENT_EXTEND_DEFAULT=n
