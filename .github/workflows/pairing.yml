# SPDX-License-Identifier: Apache-2.0
name: Pairing

on:
  pull_request:
    paths:
      - "firmware/**"
      - "tools/puckoff_setup.py"
      - "tools/requirements.txt"
      - "tests/pairing/**"
      - ".github/workflows/pairing.yml"
  push:
    branches: [main]
    paths:
      - "firmware/**"
      - "tools/puckoff_setup.py"
      - "tools/requirements.txt"
      - "tests/pairing/**"
      - ".github/workflows/pairing.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pairing-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pairing-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5, Node 24
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6, Node 24
        with:
          python-version: "3.12.12"
      - name: Synthetic pairing and setup regression suite
        env:
          CC: clang
        run: python -m unittest discover -s tests/pairing -p 'test_*.py' -v
